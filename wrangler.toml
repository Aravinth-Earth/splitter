# Splitter — one code, one group, a shared ledger the server cannot read.
#
# Served on the public site's own origin through a Worker route, the same pattern as the
# Estimation app: the page and the API live at /w/expense-splitter/, and the Worker answers
# both so the security headers cannot be bypassed by reading a static file directly.
#
# Two Durable Object classes: the Registry singleton holds the slot ledger, and one Group holds
# one group's records. Both are SQLite-backed: a new namespace can only be created with the
# SQLite backend now, and it is the only one the SQL API (the ledger table) is available on. The
# Group keeps its records in the key-value API, which a SQLite-backed namespace serves as well.
name = "splitter"
main = "src/index.js"
compatibility_date = "2026-10-30"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[durable_objects.bindings]]
name = "GROUPS"
class_name = "Group"

# v1 creates both namespaces. The bindings and the classes land together: a binding without a
# migration fails the deploy, and a migration without a class fails it too.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Registry", "Group"]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
# Missing paths are answered by the Worker, not by a static page: the 404 has to link back to
# whichever prefix served it (preview or canonical), and a file cannot know that.
not_found_handling = "none"
# Assets would otherwise be served before the Worker, and the page would lose the CSP/HSTS
# headers the rest of the site sets.
run_worker_first = true

# The canonical site. The Worker answers it, so the page and its security headers cannot be
# obtained from a static file, and the old localStorage build is retired from this path.
[[routes]]
pattern = "www.332321.xyz/w/expense-splitter/*"
zone_name = "332321.xyz"

# A wildcard route does not match the slash-less path, so the bare canonical path needs its own.
[[routes]]
pattern = "www.332321.xyz/w/expense-splitter"
zone_name = "332321.xyz"

# The preview route serves the SAME asset tree as the canonical path (the Worker rewrites the
# prefix), so a branch build can be exercised without touching what visitors see.
[[routes]]
pattern = "www.332321.xyz/w/expense-splitter-preview/*"
zone_name = "332321.xyz"

# A wildcard route does not match the slash-less path, so the bare preview path needs its own.
[[routes]]
pattern = "www.332321.xyz/w/expense-splitter-preview"
zone_name = "332321.xyz"

# Workers Builds runs `npx wrangler preview` for every branch push, and that command refuses to
# run without this block -- an empty one is enough. Without it every branch build fails in a few
# seconds and every PR carries a red check that says nothing about the code.
[previews]

# The Worker reaches both classes through `env`, so a Preview needs the bindings too: without them
# /api/create answers 1101 in a Preview instead of reserving anything. Each Preview still gets its
# own namespace and storage.
[[previews.durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[previews.durable_objects.bindings]]
name = "GROUPS"
class_name = "Group"

[observability]
enabled = true
