# Splitter — one code, one group, a shared ledger the server cannot read.
#
# The app owns the root of its own origin, the same pattern as the Estimation app and the
# bookmarks: a hostname per app, with the page and the API on that origin so the security headers
# cannot be bypassed by reading a static file directly. The main site carries the introduction at
# www.332321.xyz/w/expense-splitter/ and no longer routes that path here.
#
# Two Durable Object classes: the Registry singleton holds the slot ledger, and one Group holds
# one group's records. Both are SQLite-backed: a new namespace can only be created with the
# SQLite backend now, and it is the only one the SQL API (the ledger table) is available on. The
# Group keeps its records in the key-value API, which a SQLite-backed namespace serves as well.
name = "splitter"
main = "src/index.js"
compatibility_date = "2026-10-30"

[vars]
# The roster cap: the host plus every pending or approved member. A join is refused with
# `group_full` at this number; the host's seat is one of them. The store holds no default that can
# drift from the code: unset or malformed falls back to 20 in src/group.js.
MAX_MEMBERS = "20"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[durable_objects.bindings]]
name = "GROUPS"
class_name = "Group"

# v1 creates both namespaces. The bindings and the classes land together: a binding without a
# migration fails the deploy, and a migration without a class fails it too.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Registry", "Group"]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
# Missing paths are answered by the Worker, not by a static page: the 404 is generated there so it
# can carry the site's security headers, which a static file cannot.
not_found_handling = "none"
# Assets would otherwise be served before the Worker, and the page would lose the CSP/HSTS
# headers the rest of the site sets.
run_worker_first = true

# The app's own origin. The name is the mount: the Worker answers / and /api/* on this host, and
# no path on the main site reaches it.
#
# One pattern, with the wildcard at the end of the path. Cloudflare accepts wildcards only at the
# beginning of the hostname and the end of the path, so a host-only pattern is refused outright
# (API code 10022) — after the merge, in the deploy, where no local dry run can see it. A request
# to the bare host arrives with the path `/` and matches `/*`, and the wildcard covers every path
# beneath it, including a query-carrying link.
[[routes]]
pattern = "expense-splitter.332321.xyz/*"
zone_name = "332321.xyz"

# Workers Builds runs `npx wrangler preview` for every branch push, and that command refuses to
# run without this block -- an empty one is enough. Without it every branch build fails in a few
# seconds and every PR carries a red check that says nothing about the code.
[previews]

# The Worker reaches both classes through `env`, so a Preview needs the bindings too: without them
# /api/create answers 1101 in a Preview instead of reserving anything. Each Preview still gets its
# own namespace and storage.
[[previews.durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[previews.durable_objects.bindings]]
name = "GROUPS"
class_name = "Group"

[observability]
enabled = true
