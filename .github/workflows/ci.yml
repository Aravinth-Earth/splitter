name: ci

# The mechanical gate every PR has to pass before a review is worth asking for.
# Workers Builds is the deploy path (merge to main); this is the build check.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: install
        run: npm ci

      # The lockfile is the whole supply chain here, and the project ships one runtime dependency
      # plus a dev tool. A high-severity advisory in either fails the build rather than waiting for
      # someone to read a Dependabot email: Dependabot opens the fix, this refuses the vulnerable tree.
      - name: no known-vulnerable dependency is installed
        run: npm audit --audit-level=high

      - name: guards — no third-party, no inline handlers, no overclaiming copy
        run: npm run check

      - name: tests — node:test
        run: npm test

      - name: wrangler configuration resolves and bundles
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dry-run"
