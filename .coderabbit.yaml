# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Every PR is reviewed. There is no pause on incremental reviews and no draft skipping, because the
# point of the bot here is a second pair of eyes on code that holds other people's money data.
#
# Note: CodeRabbit only reviews public repositories with fewer than 10 stars when a review is asked
# for explicitly, so a PR without a review is usually waiting for `@coderabbitai review` rather than
# ineligible.
language: "en"
reviews:
  profile: "chill"
  # The merge gate: CodeRabbit requests changes while findings are open and approves once every
  # thread is resolved. Branch protection requires that approval, so this is what makes "no merge
  # without the review" mechanical instead of a promise.
  request_changes_workflow: true
  high_level_summary: true
  changed_files_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  sequence_diagrams: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    base_branches:
      - "main"
  path_filters:
    - "!**/node_modules/**"
    - "!.wrangler/**"
    - "!package-lock.json"
  path_instructions:
    - path: "src/**"
      instructions: |
        This directory is the Cloudflare Worker and its Durable Objects. Review it against these contracts:
        - The server holds NO business logic and NO plaintext. A name, an amount, a description or a split must
          never appear in `src/` — not in a log line, an error, a test fixture or a comment example. The server
          may only see ids, record kinds, revision numbers, blob lengths, timestamps and who wrote what.
        - Every incoming frame is validated before it is acted on: a known `t`, a known record kind, an id of the
          right shape, a blob within the size cap. A refusal names a code and changes nothing.
        - Host-only actions (approve, reject, remove, join mode, destroy) are gated on the socket's identity, never
          on a field the client sends in the frame.
        - One storage key per record (`r:<kind>:<id>`). Never accumulate a growing state object in one key.
        - A write carries the revision it was based on; a mismatched base is refused, never renumbered.
        - A pending or removed member receives no records at all.
    - path: "public/**"
      instructions: |
        This directory is the browser bundle, served as-is. Review it against these contracts:
        - No third-party anything: no CDN, no analytics, no web font, no inline event handler. A new external URL
          is a defect, not a preference.
        - Money is integer paise (`amountMinor`) everywhere. A float amount, or a comparison with a 0.01 tolerance,
          is a defect.
        - Every value that leaves the page is sealed first, and the associated data binds it to its kind, group and
          id. A plaintext field in a frame, in a log or in an `aria-label` is a defect.
        - The group code never appears in a request, a log, a URL path or a query string — only in the fragment.
        - Copy must not overclaim: "no third-party anything" is true and allowed; "no data sent anywhere" is false
          and banned, because ciphertext does go to our own Worker.
        - A user-visible state is never blank or a bare spinner: each has a sentence and an action.
    - path: "scripts/**"
      instructions: |
        Test and build tooling. A test that asserts an absence must also prove its capture was non-empty, and a
        suite must clean up anything it creates on the server.
chat:
  auto_reply: false
